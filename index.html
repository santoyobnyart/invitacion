<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SantoyoFest · 30 años</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Fondos animados -->
  <div class="orb o1" aria-hidden="true"></div>
  <div class="orb o2" aria-hidden="true"></div>
  <div class="orb o3" aria-hidden="true"></div>
  <div id="glow" aria-hidden="true"></div>

  <!-- Botón música fijo -->
  <button id="btnMusica" class="music-btn" aria-label="Reproducir música">♪ Música</button>
  <audio id="audio" src="charles.mp3" loop></audio>

  <main>

    <!-- HERO: Foto + stickers alrededor -->
    <section class="hero rise" style="animation-delay:.1s" aria-label="Hero">

      <!--
      Stickers arrastrables y hero-photo (código original preservado)

      <div class="sticker" id="s-balloon"
           data-x="12" data-y="4"
           title="Arrastra este sticker">
        <img src="sticker-30.png" alt="Globo 30 años"
             onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'sticker-ph',textContent:'🎈 30'}))">
      </div>

      <div class="sticker" id="s-ball"
           data-x="5" data-y="60"
           title="Arrastra este sticker">
        <img src="sticker-balon.png" alt="Balón"
             onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'sticker-ph',textContent:'⚽'}))">
      </div>

      <div class="sticker" id="s-bottle1"
           data-x="-4" data-y="50"
           title="Arrastra este sticker">
        <img src="sticker-botella1.png" alt="Botella 1"
             onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'sticker-ph',textContent:'🍺'}))">
      </div>

      <div class="sticker" id="s-bottle2"
           data-x="76" data-y="50"
           title="Arrastra este sticker">
        <img src="sticker-botella2.png" alt="Botella 2"
             onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'sticker-ph',textContent:'🍺'}))">
      </div>

      <div class="sticker" id="s-surf"
           data-x="72" data-y="36"
           title="Arrastra este sticker">
        <img src="sticker-tabla.png" alt="Tabla de surf"
             onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'sticker-ph',textContent:'🏄'}))">
      </div>

      <div class="sticker" id="s-glass"
           data-x="70" data-y="70"
           title="Arrastra este sticker">
        <img src="sticker-vaso.png" alt="Vaso de whisky"
             onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'sticker-ph',textContent:'🥃'}))">
      </div>

      <div class="sticker" id="s-cat"
           data-x="-2" data-y="70"
           title="Arrastra este sticker">
        <img src="sticker-gato.png" alt="Gatito"
             onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'sticker-ph',textContent:'🐱'}))">
      </div>

      <div class="sticker" id="s-pool"
           data-x="8" data-y="78"
           title="Arrastra este sticker">
        <img src="sticker-pool.png" alt="Bola de billar 8"
             onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'sticker-ph',textContent:'🎱'}))">
      </div>

      <div class="hero-photo">
        <img src="foto.png" alt="Santoyo"
             onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'photo-ph',textContent:'FOTO.PNG'}))">
      </div>
      -->

      <div class="hero-tilt">
        <img class="hero-img" src="HB_2.png" alt="Santoyo">
        <div class="hero-shine" aria-hidden="true"></div>
        <div class="hero-shimmer" aria-hidden="true"></div>
      </div>

    </section>

    <!-- Título -->
    <header class="rise" style="animation-delay:.3s">
      <div class="kicker">30 AÑOS</div>
      <h1>SANTOYO FEST</h1>
    </header>

    <!-- Fecha, lugar, mapa -->
    <div class="info rise" style="animation-delay:.45s">
      <span><b id="fecha"></b></span>
      <span class="tag-pisto">Trae tu pisto</span>
      <a class="map-link" id="mapa" target="_blank" rel="noopener">Ver ubicación ↗</a>
    </div>

    <!-- Countdown -->
    <section class="count rise" style="animation-delay:.6s" aria-live="off" aria-label="Cuenta regresiva">
      <div class="cell"><span class="num" id="cd-d">00</span><span class="lbl">Días</span></div>
      <div class="cell"><span class="num" id="cd-h">00</span><span class="lbl">Horas</span></div>
      <div class="cell"><span class="num" id="cd-m">00</span><span class="lbl">Min</span></div>
      <div class="cell"><span class="num" id="cd-s">00</span><span class="lbl">Seg</span></div>
    </section>

    <!-- Spotify playlist -->
    <a class="spotify-card rise" style="animation-delay:.68s"
       href="https://open.spotify.com/playlist/2X0Mwe5hKXdUKyXOA7mDit?si=f3aae3eefb664091&pt=3147bb4677ed1e5bc5087e1d5f3e99d5"
       target="_blank" rel="noopener">
      <svg class="spotify-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#1DB954" d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
      </svg>
      <div class="spotify-text">
        <span class="spotify-kicker">Playlist del evento</span>
        <span class="spotify-title">SantoyoFest Mix 🎶</span>
      </div>
    </a>

    <!-- CTA -->
    <button id="btnRsvp" class="cta rise" style="animation-delay:.75s">
      Confirmar asistencia ✦
    </button>
    <p class="hint rise" style="animation-delay:.85s">Confirma antes del 2 de noviembre</p>

    <!-- Formulario RSVP -->
    <section class="rsvp" id="rsvp" aria-hidden="true">
      <div id="formView">
        <h2>¿Vas a llegar?</h2>
        <p class="sub">Déjanos tu nombre y cuántos llegan contigo.</p>
        <form id="form" novalidate>
          <div class="field">
            <label for="nombre">Tu nombre</label>
            <input id="nombre" name="nombre" type="text"
                   placeholder="Ej. Rodrigo García"
                   autocomplete="name" required maxlength="60">
          </div>
          <div class="field">
            <label for="acompanantes">Acompañantes</label>
            <select id="acompanantes" name="acompanantes">
              <option value="1">1 persona (solo yo)</option>
              <option value="2">2 personas</option>
              <option value="3">3 personas</option>
              <option value="4">4 personas</option>
              <option value="5">5 personas</option>
            </select>
          </div>
          <button type="submit" class="submit" id="submitBtn">Confirmar ✦</button>
        </form>
      </div>
      <div class="success" id="successView" aria-live="polite">
        <div class="big">¡Nos vemos! 🎉</div>
        <p>Tu asistencia quedó registrada. Trae tu pisto.</p>
      </div>
    </section>

    <footer class="footer rise" style="animation-delay:1s">
      Santoyo Fest · 2026
    </footer>

  </main>

  <script src="app.js"></script>
</body>
</html>
